spring:
  application:
    name: culitostracker
  datasource:
    # Either provide DB_URL directly, or the discrete parts (useful on PaaS
    # platforms that inject managed-database credentials as separate vars).
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:culitostracker}${DB_PARAMS:}}
    username: ${DB_USER:culitos}
    password: ${DB_PASSWORD:change-me-locally}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

app:
  jwt:
    # Never commit a real secret. See .env.example.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-0123456789}
    access-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-days: ${JWT_REFRESH_DAYS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Base URL of the SPA, used to build password-reset links. When unset, the
  # first CORS origin is used. Reset emails go out only if SMTP is configured
  # (SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME,
  # SPRING_MAIL_PASSWORD); otherwise the link is written to the server log.
  frontend-url: ${APP_FRONTEND_URL:}
  mail:
    from: ${MAIL_FROM:no-reply@culitostracker.local}
  # Web Push reminders. Generate a VAPID pair (npx web-push generate-vapid-keys)
  # and set both keys; with them unset, push is off and the UI hides reminders.
  push:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:admin@culitostracker.local}
  # Stripe subscriptions. Unset = billing off and every account is PRO.
  billing:
    stripe-secret-key: ${STRIPE_SECRET_KEY:}
    stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    stripe-price-id: ${STRIPE_PRICE_ID:}
  limits:
    partners-per-day: 10
    encounters-per-day: 10

logging:
  level:
    org.hibernate.SQL: warn
