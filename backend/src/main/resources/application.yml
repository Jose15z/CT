spring:
  application:
    name: culitostracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/culitostracker}
    username: ${DB_USER:culitos}
    password: ${DB_PASSWORD:change-me-locally}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

app:
  jwt:
    # Never commit a real secret. See .env.example.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-0123456789}
    access-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-days: ${JWT_REFRESH_DAYS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  limits:
    partners-per-day: 10

logging:
  level:
    org.hibernate.SQL: warn
